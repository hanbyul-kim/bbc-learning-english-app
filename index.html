<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BBC 6 Minute English - Podcast Episodes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            padding: 40px;
        }

        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #ff6b6b;
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
        }

        .stats {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            color: white;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-top: 5px;
        }

        .search-box {
            margin-bottom: 30px;
        }

        .search-box input {
            width: 100%;
            padding: 15px 20px;
            font-size: 1rem;
            border: none;
            border-radius: 10px;
            background: rgba(255,255,255,0.95);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .search-box input:focus {
            outline: none;
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        .episodes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .episode-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .episode-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.2);
        }

        .episode-date {
            font-size: 0.85rem;
            color: #667eea;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .episode-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #2d3748;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .episode-description {
            font-size: 0.95rem;
            color: #4a5568;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .episode-link {
            display: inline-block;
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: opacity 0.3s ease;
        }

        .episode-link:hover {
            opacity: 0.9;
        }

        .no-results {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            padding: 40px;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 20px 20px 0 0;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .close-button {
            position: absolute;
            right: 20px;
            top: 20px;
            font-size: 2rem;
            color: white;
            cursor: pointer;
            background: rgba(255,255,255,0.2);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }

        .close-button:hover {
            background: rgba(255,255,255,0.3);
        }

        .modal-title {
            font-size: 1.8rem;
            margin-bottom: 10px;
            padding-right: 50px;
        }

        .modal-date {
            opacity: 0.9;
            font-size: 1rem;
        }

        .modal-body {
            padding: 30px;
        }

        .audio-player {
            background: #f7fafc;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .audio-player audio {
            width: 100%;
            margin-bottom: 15px;
        }

        .audio-links {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .audio-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: opacity 0.3s;
        }

        .audio-link:hover {
            opacity: 0.9;
        }

        .transcript-section {
            margin-top: 30px;
        }

        .transcript-section h3 {
            font-size: 1.3rem;
            color: #2d3748;
            margin-bottom: 15px;
        }

        .transcript-content {
            background: #f7fafc;
            padding: 25px;
            border-radius: 15px;
            line-height: 1.8;
            color: #4a5568;
            font-size: 1rem;
        }

        .transcript-loading {
            text-align: center;
            padding: 40px;
            color: #718096;
        }

        .transcript-error {
            background: #fff5f5;
            color: #c53030;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .transcript-pdf-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: #4299e1;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            margin-top: 15px;
        }

        .transcript-pdf-link:hover {
            background: #3182ce;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .episodes-grid {
                grid-template-columns: 1fr;
            }

            .modal-content {
                max-height: 95vh;
            }

            .modal-header {
                padding: 20px;
            }

            .modal-title {
                font-size: 1.4rem;
            }

            .modal-body {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎧 BBC 6 Minute English</h1>
            <p class="subtitle">Learn and practice English with engaging topics</p>
        </header>

        <div id="stats" class="stats" style="display: none;">
            <div class="stat-item">
                <div class="stat-number" id="totalEpisodes">0</div>
                <div class="stat-label">Total Episodes</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="latestYear">2025</div>
                <div class="stat-label">Latest Year</div>
            </div>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 Search episodes by title or description...">
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Loading episodes from BBC Learning English...</p>
        </div>

        <div id="error" style="display: none;"></div>

        <div id="episodesList" class="episodes-grid"></div>

        <!-- Episode Player Modal -->
        <div id="playerModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <span class="close-button" onclick="closeModal()">&times;</span>
                    <h2 class="modal-title" id="modalTitle"></h2>
                    <div class="modal-date" id="modalDate"></div>
                </div>
                <div class="modal-body">
                    <div class="audio-player">
                        <audio id="audioPlayer" controls preload="metadata">
                            Your browser does not support the audio element.
                        </audio>
                        <div class="audio-links">
                            <a id="downloadMp3" href="#" download class="audio-link">
                                📥 Download MP3
                            </a>
                            <a id="bbcPageLink" href="#" target="_blank" class="audio-link">
                                🔗 BBC Page
                            </a>
                        </div>
                    </div>

                    <div id="episodeDescription" style="margin-bottom: 20px; color: #4a5568; line-height: 1.6;"></div>

                    <div class="transcript-section">
                        <h3>📄 Transcript</h3>
                        <div id="transcriptContainer">
                            <div class="transcript-loading">
                                Loading transcript...
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allEpisodes = [];

        async function loadEpisodes() {
            const loadingEl = document.getElementById('loading');
            const errorEl = document.getElementById('error');
            const episodesListEl = document.getElementById('episodesList');
            const statsEl = document.getElementById('stats');

            try {
                // Using rss2json.com as a CORS proxy
                const RSS_FEED = 'https://feeds.bbci.co.uk/learningenglish/english/features/6-minute-english/rss';
                const API_URL = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(RSS_FEED)}`;

                const response = await fetch(API_URL);
                const data = await response.json();

                if (data.status !== 'ok') {
                    throw new Error('Failed to load RSS feed');
                }

                allEpisodes = data.items.map(item => ({
                    title: item.title,
                    description: item.description.replace(/<[^>]*>/g, ''), // Remove HTML tags
                    link: item.link,
                    pubDate: new Date(item.pubDate),
                    guid: item.guid
                }));

                // Update stats
                document.getElementById('totalEpisodes').textContent = allEpisodes.length;
                if (allEpisodes.length > 0) {
                    const latestYear = allEpisodes[0].pubDate.getFullYear();
                    document.getElementById('latestYear').textContent = latestYear;
                }
                statsEl.style.display = 'flex';

                // Display episodes
                displayEpisodes(allEpisodes);

                loadingEl.style.display = 'none';

            } catch (error) {
                console.error('Error loading episodes:', error);
                loadingEl.style.display = 'none';
                errorEl.style.display = 'block';
                errorEl.innerHTML = `
                    <h3>⚠️ Unable to load episodes</h3>
                    <p>Please try refreshing the page or visit the <a href="https://www.bbc.co.uk/learningenglish/english/features/6-minute-english" target="_blank" style="color: white; text-decoration: underline;">BBC Learning English website</a> directly.</p>
                    <p style="margin-top: 10px; font-size: 0.9rem;">Error: ${error.message}</p>
                `;
            }
        }

        // Construct download URLs based on episode data
        function constructDownloadUrls(episode) {
            // Extract date in YYMMDD format
            const year = episode.pubDate.getFullYear().toString().slice(-2);
            const month = String(episode.pubDate.getMonth() + 1).padStart(2, '0');
            const day = String(episode.pubDate.getDate()).padStart(2, '0');
            const datePrefix = year + month + day;

            // Create slug from title (lowercase, replace spaces with underscores, remove special chars)
            const titleSlug = episode.title
                .toLowerCase()
                .replace(/[^a-z0-9\s-]/g, '')
                .replace(/\s+/g, '_')
                .replace(/_+/g, '_')
                .replace(/^_|_$/g, '');

            // Construct URLs based on BBC pattern
            const baseUrl = 'https://downloads.bbc.co.uk/learningenglish/features/6min/';
            const mp3Url = `${baseUrl}${datePrefix}_6_minute_english_${titleSlug}_download.mp3`;
            const transcriptUrl = `${baseUrl}${datePrefix}_6_minute_english__${titleSlug}_transcript.pdf`;

            return { mp3Url, transcriptUrl };
        }

        // Open episode player modal
        function openEpisode(episode) {
            const modal = document.getElementById('playerModal');
            const { mp3Url, transcriptUrl } = constructDownloadUrls(episode);

            // Set modal content
            document.getElementById('modalTitle').textContent = episode.title;
            document.getElementById('modalDate').textContent = formatDate(episode.pubDate);
            document.getElementById('episodeDescription').textContent = episode.description;

            // Set audio player
            const audioPlayer = document.getElementById('audioPlayer');
            audioPlayer.src = mp3Url;

            // Set download links
            document.getElementById('downloadMp3').href = mp3Url;
            document.getElementById('bbcPageLink').href = episode.link;

            // Load transcript
            loadTranscript(transcriptUrl);

            // Show modal
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // Close modal
        function closeModal() {
            const modal = document.getElementById('playerModal');
            const audioPlayer = document.getElementById('audioPlayer');

            modal.classList.remove('active');
            document.body.style.overflow = 'auto';

            // Pause audio
            audioPlayer.pause();
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('playerModal');
            if (event.target === modal) {
                closeModal();
            }
        }

        // Load transcript (PDF link for now)
        async function loadTranscript(transcriptUrl) {
            const container = document.getElementById('transcriptContainer');

            container.innerHTML = `
                <div class="transcript-content">
                    <p style="margin-bottom: 15px;">The transcript is available as a PDF file.</p>
                    <a href="${transcriptUrl}" target="_blank" class="transcript-pdf-link" download>
                        📄 Download Transcript PDF
                    </a>
                    <p style="margin-top: 15px; font-size: 0.9rem; color: #718096;">
                        You can also view the full transcript on the <a href="#" id="transcriptBbcLink" target="_blank" style="color: #667eea; text-decoration: underline;">BBC page</a>.
                    </p>
                </div>
            `;
        }

        function displayEpisodes(episodes) {
            const episodesListEl = document.getElementById('episodesList');

            if (episodes.length === 0) {
                episodesListEl.innerHTML = '<div class="no-results">No episodes found matching your search.</div>';
                return;
            }

            episodesListEl.innerHTML = episodes.map((episode, index) => `
                <div class="episode-card" onclick="openEpisode(allEpisodes.find(e => e.guid === '${episode.guid}'))">
                    <div class="episode-date">${formatDate(episode.pubDate)}</div>
                    <h3 class="episode-title">${episode.title}</h3>
                    <p class="episode-description">${truncateText(episode.description, 150)}</p>
                    <a href="#" class="episode-link" onclick="event.preventDefault(); event.stopPropagation(); openEpisode(allEpisodes.find(e => e.guid === '${episode.guid}'))">
                        Listen Now →
                    </a>
                </div>
            `).join('');
        }

        function formatDate(date) {
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            return date.toLocaleDateString('en-US', options);
        }

        function truncateText(text, maxLength) {
            if (text.length <= maxLength) return text;
            return text.substr(0, maxLength).trim() + '...';
        }

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filteredEpisodes = allEpisodes.filter(episode =>
                episode.title.toLowerCase().includes(searchTerm) ||
                episode.description.toLowerCase().includes(searchTerm)
            );
            displayEpisodes(filteredEpisodes);
        });

        // Load episodes on page load
        loadEpisodes();
    </script>
</body>
</html>
